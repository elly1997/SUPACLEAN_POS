# Render Blueprint - SUPACLEAN POS
# Optional: use this for "New > Blueprint" instead of manual Web Service.
# See DEPLOY_RENDER.md for the full step-by-step guide.

services:
  - type: web
    name: supaclean-pos
    runtime: node
    buildCommand: npm run build:render
    startCommand: npm run server:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: REACT_APP_API_URL
        sync: false

  # First of each month: preview archive (set ARCHIVE_EXECUTE=true on cron env to run for real)
  - type: cron
    name: supaclean-monthly-archive
    runtime: node
    schedule: "0 4 1 * *"
    buildCommand: npm install
    startCommand: node server/scripts/runMonthlyArchive.js
    envVars:
      - key: CRON_SECRET
        sync: false
      - key: API_URL
        fromService:
          type: web
          name: supaclean-pos
          property: hostport
      - key: ARCHIVE_MONTHS
        value: "7"
      - key: ARCHIVE_EXECUTE
        value: "false"
